server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index resume.pdf;

    location = /resume.pdf {
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = / {
        try_files /resume.pdf =404;
    }

    location / {
        return 404;
    }
}
